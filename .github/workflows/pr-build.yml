name: PR build

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: ["**"]

permissions:
  contents: read

# A new push to the same PR supersedes the previous run.
concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Always use the uv-managed interpreter pinned in .python-version, never the runner's Python.
  UV_PYTHON_PREFERENCE: only-managed
  FORCE_COLOR: "1"

jobs:
  validate:
    name: Lint, type-check, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The tests run against a real PostgreSQL, migrated by Flyway (make db-migrate-test) and
    # emptied by the suite before each test.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: game_server_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      GAME_SERVER_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/game_server_test
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0  # no floating major tag is published
        with:
          # Build from scratch: no cached packages or interpreters.
          enable-cache: false
          cache-python: false

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Create fresh virtualenv and install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check . --output-format=github

      - name: Check formatting (ruff)
        run: uv run ruff format --check .

      - name: Type-check (mypy)
        run: uv run mypy .

      - name: Build package
        run: uv build

      - name: Migrate the test database (Flyway), twice
        # The second run must apply nothing: migrations run once per database.
        run: |
          set -euo pipefail
          make db-migrate-test FLYWAY_NETWORK=host
          again=$(make db-migrate-test FLYWAY_NETWORK=host 2>&1)
          echo "$again"
          grep -q "is up to date. No migration necessary" <<<"$again"

      - name: Test (pytest)
        run: uv run pytest --cov=src --cov-report=term-missing

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: game-server:pr-${{ github.event.pull_request.number }}

      - name: Build the migrations image (not pushed)
        # The image production migrates with: Flyway (the Makefile's pin) and db/.
        run: make migrations-image IMAGE=game-server TAG=pr-${{ github.event.pull_request.number }}

      - name: Check the migrations image holds no credentials and runs as non-root
        env:
          MIGRATIONS: game-server-migrations:pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          user=$(docker image inspect "$MIGRATIONS" --format '{{.Config.User}}')
          echo "User: ${user}"
          case "$user" in ""|0|0:*|root|root:*) echo "The migrations image runs as root" >&2; exit 1 ;; esac
          if docker image inspect "$MIGRATIONS" --format '{{json .Config.Env}}' | grep -q FLYWAY_; then
            echo "The migrations image has FLYWAY_ settings baked in" >&2; exit 1
          fi

      # A successful build doesn't prove native libraries resolve at runtime (distroless
      # ships few), so start the server and wait for it to answer.
      - name: Smoke-test the image
        # Like Railway: inject PORT, reach PostgreSQL over TLS (sslmode=require, the default)
        # and wait for the health check. The migrations image migrates the database first,
        # over TLS too, which proves its JDBC driver accepts a self-signed certificate like
        # Railway's; run again, it must apply nothing.
        env:
          IMAGE: game-server:pr-${{ github.event.pull_request.number }}
          MIGRATIONS: game-server-migrations:pr-${{ github.event.pull_request.number }}
          DB_URL: postgresql://postgres:smoke@db:5432/postgres
          FLYWAY_URL: jdbc:postgresql://db:5432/postgres?sslmode=require
          FLYWAY_USER: postgres
          FLYWAY_PASSWORD: smoke
        run: |
          docker network create smoke
          # The postgres image ships a self-signed (snakeoil) certificate: enough for TLS.
          docker run -d --name db --network smoke -e POSTGRES_PASSWORD=smoke postgres:16 \
            -c ssl=on \
            -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem \
            -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
          for _ in $(seq 30); do
            docker exec db pg_isready -h localhost -U postgres && break
            sleep 1
          done
          migrate() {
            docker run --rm --network smoke -e FLYWAY_URL -e FLYWAY_USER -e FLYWAY_PASSWORD \
              "$MIGRATIONS"  # its default command: migrate
          }
          migrate
          again=$(migrate 2>&1)
          echo "$again"
          grep -q "is up to date. No migration necessary" <<<"$again"
          # The image carries no schema of its own: migrations run only through Flyway.
          docker run --rm --entrypoint /app/.venv/bin/python "$IMAGE" -c \
            "from importlib.resources import files; assert not files('game_server').joinpath('schema.sql').is_file()"
          docker run -d --name smoke --network smoke -e PORT=8123 -p 8123:8123 \
            -e GAME_SERVER_DB_URL="$DB_URL" "$IMAGE"
          for _ in $(seq 30); do
            if curl -sf localhost:8123/health | grep -q '"status":"ok"'; then
              echo "Server is healthy"; docker rm -f smoke db; exit 0
            fi
            sleep 1
          done
          docker logs smoke
          exit 1
