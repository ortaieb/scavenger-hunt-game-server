# .github/workflows/railway-deploy.yml
#
# Same file in both repos (game-server and web-app).
# On every push to main: build the Docker image, push it to GHCR tagged
# `latest` and the short git hash, then point the Railway service at the
# short-hash tag and deploy it.
#
# Manual run ("Run workflow") with a tag = rollback: skips the build and
# redeploys an existing image tag, e.g. a1b2c3d.
#
# The health check is config as code: if the repo has a railway.toml, every
# deploy (rollbacks too) applies its [deploy] healthcheckPath and
# healthcheckTimeout to the service and checks Railway reports them back.
# Railway may not read railway.toml for image deploys, so the dashboard
# settings aren't relied on. No railway.toml: the health check is left as is.
#
# If the repo has a Dockerfile.migrations, the build also pushes the migrations
# image (pinned Flyway + db/), as `<image>-migrations`, with the same tags.
#
# Needs, in the GitHub environment "production" of each repo:
#   secret   RAILWAY_TOKEN           Railway project token (production env)
#   variable RAILWAY_SERVICE_ID      ID of this repo's Railway service
#   variable RAILWAY_ENVIRONMENT_ID  ID of the Railway production environment
# Until RAILWAY_SERVICE_ID is set, the workflow only builds and pushes.

name: Build and deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing image tag to redeploy (e.g. a1b2c3d). Leave empty to build this commit."
        required: false
        default: ""

concurrency:
  group: railway-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Resolve image name and tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ -n "${INPUT_TAG}" ]; then
            tag="${INPUT_TAG}"; build=false
          else
            tag="${GITHUB_SHA::7}"; build=true
          fi
          {
            echo "image=${image}"
            echo "tag=${tag}"
            echo "build=${build}"
          } >> "$GITHUB_OUTPUT"

      - name: Check out code
        # Rollbacks too: they read the health check from railway.toml.
        uses: actions/checkout@v4

      - name: Read the health check from railway.toml
        id: healthcheck
        run: |
          set -euo pipefail
          if [ ! -f railway.toml ]; then
            echo "No railway.toml: the service's health check is left as it is."
            exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import sys, tomllib

          with open("railway.toml", "rb") as f:
              deploy = tomllib.load(f).get("deploy", {})
          path, timeout = deploy.get("healthcheckPath"), deploy.get("healthcheckTimeout")
          if not isinstance(path, str) or not path.startswith("/"):
              sys.exit("railway.toml: [deploy] healthcheckPath must be a path starting with /")
          if isinstance(timeout, bool) or not isinstance(timeout, int) or timeout <= 0:
              sys.exit("railway.toml: [deploy] healthcheckTimeout must be a positive integer")
          print(f"path={path}")
          print(f"timeout={timeout}")
          PY

      - name: Set up Docker Buildx
        if: steps.meta.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.meta.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.meta.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrations image
        # Flyway and this commit's migrations, for running them on Railway's private network.
        if: steps.meta.outputs.build == 'true' && hashFiles('Dockerfile.migrations') != ''
        env:
          IMAGE: ${{ steps.meta.outputs.image }}-migrations
          TAG: ${{ steps.meta.outputs.tag }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The one Flyway pin, from the Makefile, as for local runs and PR CI.
          flyway_image=$(make -s flyway-image)
          echo "Flyway: ${flyway_image}"
          docker buildx build --platform linux/amd64 --push \
            -f Dockerfile.migrations --build-arg FLYWAY_IMAGE="$flyway_image" \
            --label org.opencontainers.image.source="$SOURCE" \
            --label org.opencontainers.image.revision="$REVISION" \
            -t "${IMAGE}:latest" -t "${IMAGE}:${TAG}" .
          echo "### Pushed \`${IMAGE}:${TAG}\` (Flyway ${flyway_image})" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy image to Railway
        if: vars.RAILWAY_SERVICE_ID != ''
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          IMAGE_REF: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          HEALTHCHECK_PATH: ${{ steps.healthcheck.outputs.path }}
          HEALTHCHECK_TIMEOUT: ${{ steps.healthcheck.outputs.timeout }}
        run: |
          set -euo pipefail

          # Call the Railway GraphQL API; fail on HTTP errors and on GraphQL "errors".
          api() {
            local resp
            resp=$(curl -sS --fail-with-body -X POST https://backboard.railway.com/graphql/v2 \
              -H "Project-Access-Token: ${RAILWAY_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$1")
            if jq -e '.errors' >/dev/null <<<"$resp"; then
              echo "Railway API error: $resp" >&2
              return 1
            fi
            printf '%s' "$resp"
          }

          # The image, and the health check from railway.toml if there is one.
          input=$(jq -n --arg img "$IMAGE_REF" '{source: {image: $img}}')
          if [ -n "${HEALTHCHECK_PATH}" ]; then
            echo "Health check: ${HEALTHCHECK_PATH}, timeout ${HEALTHCHECK_TIMEOUT}s (from railway.toml)"
            input=$(jq --arg p "$HEALTHCHECK_PATH" --argjson t "$HEALTHCHECK_TIMEOUT" \
              '. + {healthcheckPath: $p, healthcheckTimeout: $t}' <<<"$input")
          fi

          echo "Pointing service at ${IMAGE_REF}"
          api "$(jq -n --arg s "$SERVICE_ID" --arg e "$ENVIRONMENT_ID" --argjson input "$input" '{
            query: "mutation($s: String!, $e: String!, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(serviceId: $s, environmentId: $e, input: $input) }",
            variables: {s: $s, e: $e, input: $input}
          }')" >/dev/null

          if [ -n "${HEALTHCHECK_PATH}" ]; then
            # Fail before deploying if Railway doesn't report the health check back.
            applied=$(api "$(jq -n --arg s "$SERVICE_ID" --arg e "$ENVIRONMENT_ID" '{
              query: "query($s: String!, $e: String!) { serviceInstance(serviceId: $s, environmentId: $e) { healthcheckPath healthcheckTimeout } }",
              variables: {s: $s, e: $e}
            }')" | jq -c '.data.serviceInstance')
            expected=$(jq -nc --arg p "$HEALTHCHECK_PATH" --argjson t "$HEALTHCHECK_TIMEOUT" \
              '{healthcheckPath: $p, healthcheckTimeout: $t}')
            if [ "$applied" != "$expected" ]; then
              echo "Railway reports health check ${applied}, expected ${expected} from railway.toml." >&2
              exit 1
            fi
            echo "Railway reports the health check from railway.toml: ${applied}"
          fi

          echo "Triggering deployment"
          deployment_id=$(api "$(jq -n --arg s "$SERVICE_ID" --arg e "$ENVIRONMENT_ID" '{
            query: "mutation($s: String!, $e: String!) { serviceInstanceDeployV2(serviceId: $s, environmentId: $e) }",
            variables: {s: $s, e: $e}
          }')" | jq -r '.data.serviceInstanceDeployV2')
          echo "Deployment ${deployment_id} started"

          # Wait up to 10 minutes for the deployment to finish.
          for _ in $(seq 1 60); do
            status=$(api "$(jq -n --arg id "$deployment_id" '{
              query: "query($id: String!) { deployment(id: $id) { status } }",
              variables: {id: $id}
            }')" | jq -r '.data.deployment.status')
            echo "Status: ${status}"
            case "$status" in
              SUCCESS)
                {
                  echo "### Deployed \`${IMAGE_REF}\` to Railway"
                  if [ -n "${HEALTHCHECK_PATH}" ]; then
                    echo "Health check \`${HEALTHCHECK_PATH}\`, timeout ${HEALTHCHECK_TIMEOUT}s, from \`railway.toml\`."
                  fi
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0 ;;
              FAILED|CRASHED|REMOVED|SKIPPED)
                echo "Deployment ended with status ${status}. Check the Railway logs." >&2
                exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for the deployment. Check the Railway dashboard." >&2
          exit 1
