[project]
name = "game-server"
version = "0.1.0"
description = "Game server for the scavenger hunt application"
authors = [
    { name = "Or Taieb", email = "or.taieb@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "annotated-types>=0.8.0",
    "anthropic>=1.9.0",
    "claude-agent-sdk>=0.2.165",
    "fastapi>=0.141.1",
    "httpx2>=2.13.1",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
game-server = "game_server.__main__:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # pytest uses plain assert
    "S104",  # asserting on the default bind address is not binding to it
    "S311",  # seeded pseudo-random data generates reproducible test images
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests call real services (the Claude API, OpenStreetMap): opt in with `uv run pytest -m live`.
addopts = "-ra -m 'not live'"
markers = ["live: calls a real external service (the Claude API, which needs GAME_SERVER_ANTHROPIC_API_KEY, or OpenStreetMap)"]
# Fail on warnings, e.g. an unclosed connection (ResourceWarning).
filterwarnings = ["error"]
