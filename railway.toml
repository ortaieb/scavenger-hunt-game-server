# Railway config as code: https://docs.railway.com/reference/config-as-code
# These settings override the same ones in the Railway dashboard.
# The service is deployed from a GHCR image, and Railway may not read this file for image
# deploys: .github/workflows/railway-deploy.yml applies [deploy] healthcheckPath and
# healthcheckTimeout to the service on every deploy, and checks Railway reports them back.
# Volumes and variables can't be set here: see the README's "Deploying on Railway".

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Traffic switches to a new deploy only once this answers 200. It checks that the
# PostgreSQL database answers and has its schema, so a deploy that can't reach it never goes live.
healthcheckPath = "/health"
healthcheckTimeout = 60
